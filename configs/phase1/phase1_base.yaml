# Phase 1: Simple WIRE SDF Fitting (No MAML-LoRA)
# Each shape is fit independently with a WIRE MLP.
# This is the first working step — baseline before MAML-LoRA.

# ---- Network -----------------------------------------------------------
model:
  in_features: 3
  hidden_features: 256
  hidden_layers: 4
  out_features: 1
  omega_0: 10.0
  scale: 10.0
  # WIRE (Gabor) is the default; set activation: "finer" to switch
  activation: "wire"

# ---- Training ----------------------------------------------------------
training:
  epochs: 3000
  lr: 5.0e-4
  num_points: 16384        # points per epoch
  batch_size: 4096
  eikonal_weight: 0.1      # lambda in L = L_recon + lambda * L_eikonal
  surface_ratio: 0.5       # fraction of points drawn from near-surface region
  surface_sigma: 0.01      # std of gaussian noise for surface samples

# ---- Sampling ----------------------------------------------------------
sampling:
  # Bounding box: [-1, 1]^3
  box_min: -1.0
  box_max: 1.0

# ---- Logging -----------------------------------------------------------
logging:
  log_interval: 100        # steps between loss prints
  save_interval: 500       # steps between checkpoint saves

# ---- Data --------------------------------------------------------------
data:
  num_shapes: 5
  shape_names: ["cube", "sphere", "cone", "cylinder", "chair"]